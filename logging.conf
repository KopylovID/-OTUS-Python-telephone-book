[loggers]
keys=root

[handlers]
keys=file

[formatters]
keys=simpleFormatter

[logger_root]
level=DEBUG
handlers=file

[handler_file]
class=FileHandler
formatter=simpleFormatter
args=('./temp/tb.log', 'w')

[formatter_simpleFormatter]
format=%(asctime)s - %(name)s - %(levelname)s - %(message)s
datefmt=%Y-%m-%d %H:%M:%S